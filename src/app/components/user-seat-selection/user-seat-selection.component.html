<div class="seat-selection-container">
  <div class="bus-layout">
    <div class="driver-section"><img src="assets/vehicle-staring.png" /></div>
    <div class="seats-grid">
      <div
        *ngFor="let seat of bus?.seats"
        class="seat"
        [class.booked]="seat.isBooked"
        (click)="selectSeat(seat)"
      >
        {{ seat.number }} <img class="seat-size" src="assets/car-seat.png" />
      </div>
    </div>
  </div>

  <div *ngIf="selectedSeat && !selectedSeat.isBooked" class="booking-form">
    <h3>Book Seat {{ selectedSeat.number }}</h3>
    <form (ngSubmit)="bookSeat()" #bookingForm="ngForm">
      <div class="form-group">
        <label><img class="size" src="assets/user.png" /> Name:</label>
        <input
          type="text"
          [(ngModel)]="bookingDetails.name"
          name="name"
          required
        />
      </div>

      <div class="form-group">
        <label
          ><img class="size" src="assets/destination.png" /> Destination:</label
        >
        <select
          [(ngModel)]="bookingDetails.destination"
          name="destination"
          required
        >
          <option value="MIRPUR 11">Mirpur 11</option>
          <option value="UTTARA">Uttara</option>
          <option value="DHANMONDI">Dhanmondi</option>
          <option value="GULSHAN">Gulshan</option>
          <option value="BANANI">Banani</option>
          <!-- Add more destinations -->
        </select>
      </div>

      <div class="form-group">
        <label><img class="size" src="assets/time.png" /> Time:</label>
        <select [(ngModel)]="bookingDetails.time" name="time" required>
          <option value="8:00 AM">8:00 AM</option>
          <option value="9:00 AM">9:00 AM</option>
          <option value="5:00 PM">5:00 PM</option>
          <option value="6:00 PM">6:00 PM</option>
        </select>
      </div>

      <button type="submit" [disabled]="!bookingForm.form.valid">
        Book Seat
      </button>
    </form>
  </div>

  <!-- <div *ngIf="selectedSeat?.isBooked" class="error-message">
    This seat is already booked.
  </div> -->
</div>
